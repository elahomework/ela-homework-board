<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELA Homework Board</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header class="green-header">
      <h1>📚 ELA Homework Board</h1>
      <p id="today-date" class="today-banner">Loading date...</p>
    </header>

    <!-- Block Selection Tabs with Custom Block Colors -->
    <div class="block-tabs">
      <button class="tab-btn block-1 active" onclick="switchBlock('Block 1')">1st Block</button>
      <button class="tab-btn block-2" onclick="switchBlock('Block 2')">2nd Block</button>
      <button class="tab-btn block-3" onclick="switchBlock('Block 3')">3rd Block</button>
    </div>

    <!-- Homework Container -->
    <div id="board" class="board-grid">
      <p class="loading">Loading homework board...</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
